# Who the series is by and what it's about. Every prompt is filled in from this file.
#
# To run the agent for a different person or subject, change this file together with
# content/author.md (personal facts), content/topics.yaml (the backlog) and content/feeds.yaml
# (research sources), and content/style.md if the voice should differ.
#
# Each value is dropped into a sentence, so write it to read naturally there. The comment next to
# each one shows the sentence it goes into. All fields are required.

author:
  # "You ghostwrite LinkedIn posts for <name>"
  name: Ashish Ranjan
  # "Edit this LinkedIn draft by <first_name>", "<first_name>'s honest take"
  first_name: Ashish
  # "an open-ended LinkedIn series written by <name>, <summary>."
  summary: >-
    a functional consultant who works on retail commerce, order management and integrations and
    is building toward a Forward Deployed Engineer career
  # "make the post sound like a real <kind> wrote it themselves"
  kind: engineer
  # "Each post must read like <first_name> sat down and wrote it: <voice>."
  voice: a thoughtful engineer talking to peers over chai
  # Humour pokes fun at "hype, buzzwords and common habits (including <peers> like <first_name>)"
  peers: consultants and engineers
  # "the author's own <own_work> is in the author facts and is fine to mention"
  own_work: OMS, marketplace, ERP, order and returns work

series:
  # "A skill post for the series on <theme>."
  theme: AI and the future of tech
  # "<first_name>, who writes short LinkedIn posts about <writes_about>"
  writes_about: AI, enterprise software and reliability
  # "Each skill post covers one skill and explains <skill_promise>."
  skill_promise: >-
    (a) why the skill matters most in tech today and (b) how it helps enterprises be reliable
  # New topics "stay inside the theme: <topic_areas>."; news is scored on fit with it too
  topic_areas: >-
    agentic AI, AI engineering, enterprise reliability, AI careers, integration and commerce tech
    meeting AI, and notable new developments in AI tooling
  # "Each topic must be a skill or practice <learner> can get better at"
  learner: an engineer or consultant
  # A plainly made-up scenario, as an example of how to open one: "Say ..." or "Picture ..."
  example_scenario: Say a retailer's returns agent goes live on a Tuesday...

research:
  # "Pick 1 or 2 developments that would ground the post: <focus>."
  focus: >-
    a launch or GA release, a new version of a framework or protocol, an enterprise rollout with
    concrete details, a published incident or postmortem, new guidance from a standards body or
    major vendor
  # "One sentence on why it matters for <why_it_matters_for>."
  why_it_matters_for: engineers or enterprise reliability

news:
  # "Pick 5 to 10 candidate stories that <first_name> might react to on LinkedIn: <focus>."
  focus: >-
    model launches, new agent frameworks or protocols, big enterprise AI rollouts, outages or AI
    failures with lessons, funding or acquisitions that shift the market, regulation that affects
    how companies build with AI, developer tooling changes, and commerce/retail tech meeting AI
  # 'significance: "major" only for a genuinely big story (<major>)'
  major: a major model launch, a major AI incident, a market-shifting deal or regulation
  # "Then give <first_name>'s honest take: <take>."
  take: >-
    what it means for engineers or enterprises, especially for reliability, and whether the hype
    matches reality
