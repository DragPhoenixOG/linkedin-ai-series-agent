[project]
name = "linkedin-ai-series-agent"
version = "0.1.0"
description = "Writes, checks and publishes a LinkedIn post every 3 days on AI and the future of tech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
linkedin-agent = "agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en/em dashes and curly quotes are test data here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # sample posts are long prose lines
